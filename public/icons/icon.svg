<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#080c10"/>
    </radialGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGlow)"/>
  <rect width="500" height="500" x="6" y="6" rx="94" fill="none" stroke="#00d4ff" stroke-width="4" stroke-opacity="0.4"/>
  
  <!-- Outer Holographic Diamond -->
  <path d="M 256 60 L 452 256 L 256 452 L 60 256 Z" fill="none" stroke="#00d4ff" stroke-width="6" stroke-opacity="0.3"/>
  
  <!-- Glowing Eye / Dagger Glyph -->
  <g filter="url(#neonGlow)">
    <!-- Electric Blue Monarch Wings -->
    <path d="M 256 120 L 370 240 L 256 392 L 142 240 Z" fill="#001824" stroke="#00d4ff" stroke-width="8"/>
    
    <!-- Central Lightning Dagger -->
    <path d="M 256 150 L 290 250 L 265 250 L 285 350 L 225 240 L 247 240 Z" fill="#00d4ff"/>
    
    <!-- Monarch Eye Core -->
    <circle cx="256" cy="256" r="14" fill="#ffffff"/>
  </g>
  
  <!-- Text Label -->
  <text x="256" y="440" font-family="monospace" font-weight="900" font-size="28" fill="#00d4ff" letter-spacing="6" text-anchor="middle">
    [ SYSTEM ]
  </text>
</svg>
